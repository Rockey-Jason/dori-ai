name: Dori AI Live Response Quality Benchmark

on:
  # Manual only: this diagnostic sends requests to the memory-limited free service.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dori-ai-live-response-benchmark
  cancel-in-progress: true

jobs:
  evaluate-live-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight dependencies
        run: python -m pip install -r requirements.txt

      - name: Evaluate a safe stratified sample of actual Dori AI answers
        run: |
          python scripts/evaluate_live.py \
            --base-url https://dori-ai-u3kf.onrender.com \
            --limit 8 \
            --timeout 35 \
            --report runtime/live_response_quality_report.json

      - name: Upload per-question response report
        if: always() && hashFiles('runtime/live_response_quality_report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dori-ai-live-response-quality-report
          path: runtime/live_response_quality_report.json
          if-no-files-found: warn
          retention-days: 14
