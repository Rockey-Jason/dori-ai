name: Dori AI Regression Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "dori_ai/**"
      - "scripts/**"
      - "data/curriculum/**"
      - "data/evaluation/**"
      - "tests/**"
      - "generate_final.py"
      - "requirements.txt"
      - ".github/workflows/test-dori-ai.yml"
      - ".github/workflows/train-dori-ai.yml"

permissions:
  contents: read

concurrency:
  group: dori-ai-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all application and test modules
        run: python -m compileall -q dori_ai tests scripts

      - name: Verify training queue safety settings
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/train-dori-ai.yml").read_text(encoding="utf-8")
          assert "group: dori-ai-training" in workflow, "Training concurrency group is missing"
          assert "cancel-in-progress: true" in workflow, "Stale training runs must be cancellable"
          trainer = Path("scripts/continuous_train.py").read_text(encoding="utf-8")
          assert "--rounds 250" in workflow, "Training must run in bounded, checkpointed chunks"
          assert "target = 1200" in trainer, "Expected overall training target round 1200"
          assert "scripts/evaluate_and_gate.py" in workflow, "Held-out model evaluation gate is missing"
          print("Training queue and evaluation-gate configuration passed.")
          PY
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v
