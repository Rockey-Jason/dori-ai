name: Dori AI Regression Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "dori_ai/**"
      - "tests/**"
      - "generate_final.py"
      - "requirements.txt"
      - ".github/workflows/test-dori-ai.yml"

permissions:
  contents: read

concurrency:
  group: dori-ai-tests
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all application and test modules
        run: python -m compileall -q dori_ai tests
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v
