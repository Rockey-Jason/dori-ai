name: Dori AI CI

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "dori_ai/**"
      - "scripts/**"
      - "tests/**"
      - "data/evaluation/**"
      - "requirements.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dori-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q dori_ai scripts tests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate checkpoint and inference smoke tests
        run: python scripts/preflight_dori_ai.py

      - name: Report free growth-loop status
        run: python scripts/growth_status.py
