name: Train Dori AI

on:
  workflow_dispatch:
  push:
    paths:
      - "data/new/**"
      - "data/dori_knowledge_v26.jsonl"
      - "scripts/**"
      - "train_final.py"
      - "dori_ai/**"
      - ".github/workflows/train-dori-ai.yml"

permissions:
  contents: write

concurrency:
  group: dori-ai-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate corpus
        run: |
          python -m compileall dori_ai
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/dori_knowledge_v26.jsonl")
          rows = [json.loads(x) for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
          assert rows and all(r.get("question") and r.get("answer") for r in rows)
          print("knowledge_rows=", len(rows))
          PY

      - name: Build training data and train
        run: |
          python train_final.py             --epochs 60             --max-batches 180             --batch-size 2             --seq-len 128             --dim 64             --heads 4             --layers 3             --ff-dim 256             --lr 1.5e-4             --grad-clip 1.0

      - name: Verify checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("checkpoints/best.npz.json").read_text(encoding="utf-8"))
          assert Path("checkpoints/best.npz").exists()
          assert meta["model_config"]["vocab_size"] == 768
          print("best_epoch=", meta.get("epoch"))
          print("train_loss=", meta.get("train_loss"))
          print("val_loss=", meta.get("val_loss"))
          PY

      - name: Commit trained model
        run: |
          git config user.name "dori-ai-training-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dori_knowledge_v26.jsonl data/new checkpoints/best.npz checkpoints/best.npz.json checkpoints/latest.npz checkpoints/latest.npz.json data/streaming runtime/training_history.jsonl
          git diff --cached --quiet && echo "No model changes to commit." || git commit -m "Train Dori AI v26 model"
          git push
