name: Train Dori AI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "data/new/**"
      - "data/generated/**"
      - "data/curriculum/**"
      - "data/curriculum_plan.json"
      - "data/dori_knowledge_v*.jsonl"
      - "scripts/**"
      - "train_final.py"
      - "dori_ai/**"
      - ".github/workflows/train-dori-ai.yml"

permissions:
  contents: write

concurrency:
  group: dori-ai-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate corpus
        run: |
          python -m compileall dori_ai scripts
          python - <<'PY'
          import glob, json
          paths = sorted(glob.glob("data/dori_knowledge_v*.jsonl"))
          assert paths, "No versioned Dori knowledge JSONL found"
          total = 0
          for name in paths:
              rows = [json.loads(x) for x in open(name, encoding="utf-8") if x.strip()]
              assert rows and all(r.get("question") and r.get("answer") for r in rows)
              total += len(rows)
              print(name, "rows=", len(rows))
          print("knowledge_rows_total=", total)
          PY

      - name: Run 20 continuous training rounds
        run: |
          python scripts/continuous_train.py             --rounds 20             --max-batches 48             --batch-size 2             --seq-len 128             --lr 1.5e-4             --grad-clip 1.0

      - name: Run Dori AI preflight tests
        run: |
          python scripts/preflight_dori_ai.py

      - name: Verify best checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          best = Path("checkpoints/best.npz")
          meta = Path("checkpoints/best.npz.json")
          assert best.exists() and meta.exists()
          data = json.loads(meta.read_text(encoding="utf-8"))
          assert data["model_config"]["vocab_size"] == 768
          print("best_epoch=", data.get("epoch"))
          print("train_loss=", data.get("train_loss"))
          print("val_loss=", data.get("val_loss"))
          print("training_round=", json.loads(Path("runtime/training_round.json").read_text())["round"])
          PY

      - name: Commit trained model and round state
        run: |
          git config user.name "dori-ai-training-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Continue Dori AI training rounds"
            git push
          fi

      - name: Trigger Render deploy when a deploy hook is configured
        if: success()
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error --retry 3 --retry-delay 5 "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL is not configured; GitHub model update completed."
          fi
