name: Train Dori AI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "data/new/**"
      - "data/generated/**"
      - "data/curriculum/**"
      - "data/curriculum_plan.json"
      - "data/dori_knowledge_v*.jsonl"
      - "scripts/**"
      - "train_final.py"
      - "dori_ai/**"
      - ".github/workflows/train-dori-ai.yml"

permissions:
  contents: write

concurrency:
  group: dori-ai-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect broad multilingual world knowledge
        run: |
          python scripts/collect_world_knowledge.py --pages-per-topic 2 --delay 0.08

      - name: Validate corpus
        run: |
          python -m compileall dori_ai scripts
          python - <<'PY'
          import glob, json
          paths = sorted(glob.glob("data/dori_knowledge_v*.jsonl"))
          assert paths, "No versioned Dori knowledge JSONL found"
          total = 0
          for name in paths:
              rows = [json.loads(x) for x in open(name, encoding="utf-8") if x.strip()]
              assert rows and all(r.get("question") and r.get("answer") for r in rows)
              total += len(rows)
              print(name, "rows=", len(rows))
          print("knowledge_rows_total=", total)
          PY

      - name: Run continuous training through round 1000
        run: |
          # One invocation requests all remaining rounds.
          # Four batches per micro-round keeps the full 1000-round curriculum
          # within the GitHub Actions execution window while still performing
          # 4000 optimizer batches across the complete curriculum.
          python scripts/continuous_train.py \
            --rounds 1000 \
            --max-batches 4 \
            --batch-size 2 \
            --seq-len 128 \
            --lr 1.5e-4 \
            --grad-clip 1.0

      - name: Run Dori AI preflight tests
        run: |
          python scripts/preflight_dori_ai.py

      - name: Run unit regression tests
        run: |
          python -m unittest discover -s tests -v

      - name: Verify best checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          best = Path("checkpoints/best.npz")
          meta = Path("checkpoints/best.npz.json")
          state = Path("runtime/training_round.json")
          assert best.exists() and meta.exists() and state.exists()
          data = json.loads(meta.read_text(encoding="utf-8"))
          training_round = json.loads(state.read_text(encoding="utf-8"))["round"]
          assert data["model_config"]["vocab_size"] == 768
          assert data["model_config"]["dim"] == 256
          assert data["model_config"]["heads"] == 8
          assert data["model_config"]["layers"] == 8
          assert data["model_config"]["ff_dim"] == 1024
          assert training_round == 1000, f"Expected round 1000, got {training_round}"
          print("best_epoch=", data.get("epoch"))
          print("train_loss=", data.get("train_loss"))
          print("val_loss=", data.get("val_loss"))
          print("training_round=", training_round)
          PY

      - name: Commit trained model and round state safely
        run: |
          set -e
          git config user.name "dori-ai-training-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Continue Dori AI training rounds"

          # Synchronize with main without blindly overwriting remote source
          # changes. Only generated training artifacts may be resolved in favor
          # of the newly trained result.
          GENERATED_REGEX='^(checkpoints/|runtime/training_round[.]json$|runtime/continuous_rounds[.]jsonl$)'

          for attempt in 1 2 3; do
            echo "Synchronizing with origin/main (attempt $attempt/3)..."
            git fetch origin main

            if git merge --no-edit --no-ff origin/main; then
              echo "Remote main merged cleanly."
            else
              echo "Merge conflict detected. Inspecting conflicted paths..."
              CONFLICTS="$(git diff --name-only --diff-filter=U)"
              echo "$CONFLICTS"

              UNSAFE=0
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                if [[ ! "$path" =~ $GENERATED_REGEX ]]; then
                  echo "::error::Source conflict detected in $path; refusing to overwrite remote changes."
                  UNSAFE=1
                fi
              done <<< "$CONFLICTS"

              if [ "$UNSAFE" -ne 0 ]; then
                git merge --abort || true
                exit 1
              fi

              while IFS= read -r path; do
                [ -z "$path" ] && continue
                git checkout --ours -- "$path"
                git add -- "$path"
              done <<< "$CONFLICTS"

              git commit --no-edit
              echo "Only generated training artifacts conflicted; kept the new trained artifacts."
            fi

            if git push origin HEAD:main; then
              echo "Training commit pushed successfully."
              exit 0
            fi

            echo "Push raced with another update; retrying after a fresh fetch/merge..."
            sleep 3
          done

          echo "::error::Could not push after 3 synchronization attempts."
          exit 1

      - name: Trigger Render deploy when a deploy hook is configured
        if: success()
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error --retry 3 --retry-delay 5 "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL is not configured; GitHub model update completed."
          fi
